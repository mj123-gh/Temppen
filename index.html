<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kanalvy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEF; --panel:#F6F8F9; --ink:#17242C; --muted:#56666F; --line:#C9D3D8;
  --signal:#1F6F8B; --alarm:#B23A2B; --warn:#A96F0A; --ok:#2E7D5B;
  --c1:#1F6F8B; --c2:#7A4E9A; --c3:#2E7D5B; --c4:#A96F0A; --c5:#B23A2B; --c6:#3D5A80; --c7:#8A6B3E; --c8:#4F7F86;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C; --panel:#17222A; --ink:#E2E9ED; --muted:#91A1AA; --line:#2B3A43;
    --signal:#5BB4D3; --alarm:#E66B58; --warn:#E3A83F; --ok:#5DC093;
    --c1:#5BB4D3; --c2:#B48AD6; --c3:#5DC093; --c4:#E3A83F; --c5:#E66B58; --c6:#8DA9D4; --c7:#CFAE7C; --c8:#7FC1C9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F171C; --panel:#17222A; --ink:#E2E9ED; --muted:#91A1AA; --line:#2B3A43;
    --signal:#5BB4D3; --alarm:#E66B58; --warn:#E3A83F; --ok:#5DC093;
    --c1:#5BB4D3; --c2:#B48AD6; --c3:#5DC093; --c4:#E3A83F; --c5:#E66B58; --c6:#8DA9D4; --c7:#CFAE7C; --c8:#7FC1C9;
    color-scheme:dark;
  }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:"Barlow Semi Condensed",Barlow,"Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.bar h1{font-size:1.35rem;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;min-height:38px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F171C}}
:root[data-theme="dark"] .btn.primary{color:#0F171C}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--alarm);border-color:var(--alarm);background:transparent}
.icon{width:38px;padding:0;display:inline-grid;place-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Kanallista */
.chlist{display:grid;gap:10px}
.chrow{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:6px;padding:12px 14px}
.chrow.stale{border-left-color:var(--warn)}
.chrow.alarm{border-left-color:var(--alarm)}
.chrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chrow .name{font-weight:600;font-size:1.08rem}
.chrow .vals{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.chrow .vals span b{font-size:1.25rem;font-weight:600}
.addbox{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:14px;margin-top:16px}
.addbox h2{font-size:1.05rem;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.f{display:grid;gap:3px;font-size:.88rem;color:var(--muted)}
label.f input,label.f select{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.err{color:var(--alarm);margin:8px 0 0}

/* Kanalvy */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;min-height:38px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--signal);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0F171C}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F171C}
.controls select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.custom{display:none;gap:8px;flex-wrap:wrap;width:100%}
.custom.on{display:flex}
.custom input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--fc,var(--signal));border-radius:4px;padding:10px 12px 9px;position:relative}
.tile.alarm{background:color-mix(in srgb,var(--alarm) 10%,var(--panel));border-color:var(--alarm);border-top-color:var(--alarm)}
.tile .lab{font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .big{font-size:2.15rem;line-height:1.05;font-weight:600;margin:2px 0}
.tile .big small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:3px}
.tile .meta{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.trend-up{color:var(--ink)} .trend-down{color:var(--ink)}
.stalenote{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid var(--warn);border-radius:6px;padding:8px 12px;margin-bottom:12px}

.chart{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 10px 6px;margin-bottom:12px}
.chart .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:0 4px 4px}
.chart .head h3{margin:0;font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:8px}
.chart .head h3 i{width:10px;height:10px;border-radius:2px;background:var(--fc);display:inline-block}
.chart .stats{font-size:.85rem;color:var(--muted)}
.chart .stats b{color:var(--ink);font-weight:600}
.plot{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.plot svg{display:block;width:100%}
.plot .tip{position:absolute;top:2px;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:3px 7px;border-radius:4px;white-space:nowrap;display:none}
.empty{color:var(--muted);padding:24px 6px;margin:0}
.axis{fill:var(--muted);font-size:11px;font-family:"Barlow Semi Condensed",Barlow,sans-serif}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.loading{color:var(--muted);padding:20px 0}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,18,22,.45)}
.dlg{padding:16px}
.dlg h2{margin:0 0 12px;font-size:1.2rem}
.fieldset{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.frow .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.frow input[type=checkbox]{width:20px;height:20px;margin-top:22px;accent-color:var(--signal)}
.dlg .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
const API = 'https://api.thingspeak.com';
const LS = 'kanalvy.v1';
const TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'Europe/Helsinki';
const RANGES = [['1h','1 h',3600e3],['24h','24 h',864e5],['7d','7 d',7*864e5],['30d','30 d',30*864e5],['custom','Eget',0]];
const AVGS = [['','Alla punkter'],['10','Medel 10 min'],['60','Medel 1 h'],['240','Medel 4 h'],['1440','Medel per dygn']];
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');
const dlgBody = document.getElementById('dlgBody');

let store = { channels: [], refresh: 0 };
let view = { ch: null, range: '24h', avg: '', cStart: '', cEnd: '', data: null, latest: null, loadedAt: null };
let timer = null, resizeT = null, reqSeq = 0;

/* ---------- lagring ---------- */
function load(){
  try{
    const s = localStorage.getItem(LS);
    if(s){ const o = JSON.parse(s); if(o && Array.isArray(o.channels)) store = Object.assign({channels:[],refresh:0}, o); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

/* ---------- hjälpare ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numIn = s => { if(s == null) return null; s = String(s).trim().replace(',', '.'); if(s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const nf = (v, d) => (v == null || !isFinite(v)) ? '–' : new Intl.NumberFormat('sv-FI', {minimumFractionDigits:d, maximumFractionDigits:d}).format(v);
const tsParam = d => d.toLocaleString('sv-SE', {timeZone: TZ, hour12: false}).replace('T', ' ');
const fmtTime = t => new Date(t).toLocaleString('sv-FI', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
const fmtClock = t => new Date(t).toLocaleTimeString('sv-FI', {hour:'2-digit', minute:'2-digit'});
function ago(t){
  const s = Math.max(0, (Date.now() - t) / 1000);
  if(s < 60) return 'nyss';
  if(s < 3600) return 'för ' + Math.round(s/60) + ' min sedan';
  if(s < 86400) return 'för ' + Math.round(s/3600) + ' h sedan';
  return 'för ' + Math.round(s/86400) + ' d sedan';
}
function chById(id){ return store.channels.find(c => String(c.id) === String(id)); }
function fcfg(ch, n){ ch.fields = ch.fields || {}; return ch.fields[n] = ch.fields[n] || {}; }
function fieldLabel(ch, n, meta){ const f = fcfg(ch, n); return f.label || (meta && meta['field'+n]) || ('Fält ' + n); }
function decOf(ch, n, vals){
  const f = fcfg(ch, n);
  if(f.dec != null) return f.dec;
  const v = vals && vals.find(x => x != null);
  if(v == null) return 1;
  const a = Math.abs(v);
  return a >= 100 ? 0 : a >= 10 ? 1 : 2;
}
function isAlarm(ch, n, v){ const f = fcfg(ch, n); return v != null && ((f.min != null && v < f.min) || (f.max != null && v > f.max)); }
function activeFields(meta){ const r = []; for(let i = 1; i <= 8; i++) if(meta && meta['field'+i] != null && meta['field'+i] !== '') r.push(i); return r.length ? r : [1]; }

/* ---------- API ---------- */
async function getJSON(url){
  let r;
  try{ r = await fetch(url); }catch(e){ throw new Error('Kunde inte nå ThingSpeak. Kontrollera nätverket.'); }
  if(r.status === 400 || r.status === 401 || r.status === 403) throw new Error('Kanalen är privat eller nyckeln är fel. Ange kanalens Read API Key.');
  if(r.status === 404) throw new Error('Kanalen finns inte. Kontrollera kanal-ID:t.');
  if(!r.ok) throw new Error('ThingSpeak svarade med fel ' + r.status + '.');
  const j = await r.json();
  if(j === -1 || j === '-1') throw new Error('Kanalen är privat eller nyckeln är fel. Ange kanalens Read API Key.');
  return j;
}
function baseParams(ch){ const p = new URLSearchParams({timezone: TZ}); if(ch.key) p.set('api_key', ch.key); return p; }
async function fetchLatest(ch){
  const p = baseParams(ch); p.set('results', '2');
  return getJSON(`${API}/channels/${encodeURIComponent(ch.id)}/feeds.json?${p}`);
}
async function fetchRange(ch, start, end, avg){
  let all = [], meta = null, curEnd = end, pages = 0, truncated = false;
  while(true){
    const p = baseParams(ch);
    p.set('start', tsParam(start)); p.set('end', tsParam(curEnd)); p.set('results', '8000');
    if(avg) p.set('average', avg);
    const j = await getJSON(`${API}/channels/${encodeURIComponent(ch.id)}/feeds.json?${p}`);
    meta = j.channel; const f = j.feeds || [];
    all = f.concat(all); pages++;
    if(avg || f.length < 8000) break;
    if(pages >= 6){ truncated = true; break; }
    const first = new Date(f[0].created_at);
    curEnd = new Date(first.getTime() - 1000);
    if(curEnd <= start) break;
  }
  return { meta, feeds: all, truncated };
}
function toSeries(feeds, n){
  const out = [];
  for(const r of feeds){ const v = numIn(r['field'+n]); if(v != null) out.push({ t: new Date(r.created_at).getTime(), v }); }
  return out;
}
function lastTwo(feeds, n){
  const s = toSeries(feeds || [], n);
  return { cur: s[s.length-1] || null, prev: s[s.length-2] || null };
}

/* ---------- routing ---------- */
function route(){
  clearInterval(timer); timer = null;
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('ch')){
    const ch = chById(h.slice(2));
    if(ch){ if(!view.ch || view.ch.id !== ch.id){ view.data = null; view.latest = null; } view.ch = ch; renderChannel(); startTimer(); return; }
  }
  view.ch = null; renderList(); startTimer();
}
function startTimer(){
  if(store.refresh > 0) timer = setInterval(() => { view.ch ? loadChannel(true) : loadListValues(); }, store.refresh * 60e3);
}

/* ---------- kanallista ---------- */
function renderList(){
  document.title = 'Kanalvy';
  const rows = store.channels.map(c => `
    <button class="chrow" data-open="${esc(c.id)}" id="row-${esc(c.id)}">
      <div class="top"><span class="name">${esc(c.name || ('Kanal ' + c.id))}</span><span class="muted small age">Hämtar …</span></div>
      <div class="vals num"></div>
    </button>`).join('');
  app.innerHTML = `
    <header class="bar"><h1>Kanaler</h1>
      <button class="btn icon ghost" id="gset" aria-label="Inställningar" title="Inställningar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    ${store.channels.length ? `<div class="chlist">${rows}</div>` : `<p class="muted">Inga kanaler ännu. Lägg till en ThingSpeak-kanal nedan, eller prova med den publika testkanalen 9.</p>`}
    <form class="addbox" id="addForm" autocomplete="off">
      <h2>Lägg till kanal</h2>
      <div class="grid2">
        <label class="f">Kanal-ID<input name="id" inputmode="numeric" required placeholder="t.ex. 9"></label>
        <label class="f">Read API Key (bara privata)<input name="key" placeholder="valfritt"></label>
        <label class="f">Eget namn<input name="name" placeholder="valfritt"></label>
      </div>
      <div class="row"><button class="btn primary" type="submit">Lägg till kanal</button>${store.channels.length ? '' : '<button class="btn" type="button" id="demo">Prova kanal 9</button>'}</div>
      <p class="err" id="addErr" hidden></p>
    </form>`;
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { location.hash = 'ch' + b.dataset.open; });
  document.getElementById('gset').onclick = openGlobalSettings;
  document.getElementById('addForm').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); addChannel(fd.get('id'), fd.get('key'), fd.get('name')); };
  const demo = document.getElementById('demo'); if(demo) demo.onclick = () => addChannel('9', '', '');
  loadListValues();
}
async function addChannel(id, key, name){
  const err = document.getElementById('addErr');
  id = String(id || '').trim(); key = String(key || '').trim(); name = String(name || '').trim();
  if(!/^\d+$/.test(id)){ err.textContent = 'Kanal-ID ska vara ett nummer.'; err.hidden = false; return; }
  if(chById(id)){ err.textContent = 'Kanalen finns redan i listan.'; err.hidden = false; return; }
  const ch = { id, key, name, fields: {}, staleMin: 60 };
  try{
    const j = await fetchLatest(ch);
    if(!name && j.channel && j.channel.name) ch.name = j.channel.name;
  }catch(e){ err.textContent = e.message; err.hidden = false; return; }
  store.channels.push(ch); save(); renderList();
}
async function loadListValues(){
  for(const ch of store.channels){
    const row = document.getElementById('row-' + ch.id); if(!row) continue;
    fetchLatest(ch).then(j => {
      const meta = j.channel, feeds = j.feeds || [];
      const nums = activeFields(meta).filter(n => !fcfg(ch, n).hidden);
      let newest = null, alarm = false;
      const parts = nums.map(n => {
        const { cur } = lastTwo(feeds, n);
        if(cur && (newest == null || cur.t > newest)) newest = cur.t;
        if(cur && isAlarm(ch, n, cur.v)) alarm = true;
        const f = fcfg(ch, n);
        return `<span><span class="muted small">${esc(fieldLabel(ch, n, meta))}</span> <b>${cur ? nf(cur.v, decOf(ch, n, [cur.v])) : '–'}</b>${f.unit ? ' <span class="muted small">' + esc(f.unit) + '</span>' : ''}</span>`;
      });
      row.querySelector('.vals').innerHTML = parts.join('');
      const stale = newest != null && (Date.now() - newest) > (ch.staleMin || 60) * 60e3;
      row.querySelector('.age').textContent = newest ? ago(newest) : 'ingen data';
      row.classList.toggle('stale', stale && !alarm);
      row.classList.toggle('alarm', alarm);
    }).catch(e => { row.querySelector('.age').textContent = e.message; row.classList.add('stale'); });
  }
}

/* ---------- kanalvy ---------- */
function renderChannel(){
  const ch = view.ch;
  document.title = (ch.name || 'Kanal ' + ch.id) + ' – Kanalvy';
  const seg = RANGES.map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${view.range === k}">${l}</button>`).join('');
  const avg = AVGS.map(([k, l]) => `<option value="${k}" ${view.avg === k ? 'selected' : ''}>${l}</option>`).join('');
  app.innerHTML = `
    <header class="bar">
      <button class="btn icon ghost" id="back" aria-label="Tillbaka till kanaler" title="Kanaler"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>${esc(ch.name || 'Kanal ' + ch.id)}</h1>
      <button class="btn icon ghost" id="reload" aria-label="Uppdatera" title="Uppdatera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
      <button class="btn icon ghost" id="cset" aria-label="Kanalinställningar" title="Kanalinställningar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </header>
    <div class="controls">
      <div class="seg" role="group" aria-label="Tidsintervall">${seg}</div>
      <select id="avg" aria-label="Medelvärde">${avg}</select>
      <span class="muted small" id="loaded"></span>
      <div class="custom ${view.range === 'custom' ? 'on' : ''}" id="custom">
        <label class="f">Från<input type="datetime-local" id="cStart" value="${esc(view.cStart)}"></label>
        <label class="f">Till<input type="datetime-local" id="cEnd" value="${esc(view.cEnd)}"></label>
        <button class="btn" id="cGo" type="button" style="align-self:end">Visa intervall</button>
      </div>
    </div>
    <div id="stale"></div>
    <div class="tiles" id="tiles"></div>
    <div id="charts"><p class="loading">Hämtar data …</p></div>
    <div class="foot">
      <button class="btn" id="csv" type="button">Exportera CSV</button>
      <a class="btn" style="text-decoration:none;display:inline-grid;place-items:center" href="https://thingspeak.mathworks.com/channels/${encodeURIComponent(ch.id)}" target="_blank" rel="noopener">Öppna i ThingSpeak</a>
    </div>`;
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('reload').onclick = () => loadChannel(true);
  document.getElementById('cset').onclick = openChannelSettings;
  document.getElementById('csv').onclick = exportCSV;
  document.getElementById('avg').onchange = e => { view.avg = e.target.value; loadChannel(false); };
  app.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    view.range = b.dataset.range;
    app.querySelectorAll('[data-range]').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('custom').classList.toggle('on', view.range === 'custom');
    if(view.range === 'custom'){
      if(!view.cStart){ const e = new Date(), s = new Date(Date.now() - 3*864e5); view.cStart = localInput(s); view.cEnd = localInput(e); document.getElementById('cStart').value = view.cStart; document.getElementById('cEnd').value = view.cEnd; }
      return;
    }
    loadChannel(false);
  });
  document.getElementById('cGo').onclick = () => { view.cStart = document.getElementById('cStart').value; view.cEnd = document.getElementById('cEnd').value; loadChannel(false); };
  if(view.data) paint(); 
  loadChannel(!!view.data);
}
function localInput(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function rangeBounds(){
  if(view.range === 'custom'){
    const s = new Date(view.cStart), e = new Date(view.cEnd);
    if(isNaN(s) || isNaN(e) || e <= s) return null;
    return [s, e];
  }
  const ms = RANGES.find(r => r[0] === view.range)[2];
  const e = new Date(); return [new Date(e.getTime() - ms), e];
}
async function loadChannel(quiet){
  const ch = view.ch; if(!ch) return;
  const b = rangeBounds();
  const charts = document.getElementById('charts');
  if(!b){ charts.innerHTML = '<p class="err">Välj ett giltigt intervall där Till är senare än Från.</p>'; return; }
  if(!quiet && charts) charts.innerHTML = '<p class="loading">Hämtar data …</p>';
  const seq = ++reqSeq;
  try{
    const [latest, data] = await Promise.all([fetchLatest(ch), fetchRange(ch, b[0], b[1], view.avg)]);
    if(seq !== reqSeq || view.ch !== ch) return;
    view.latest = latest; view.data = data; view.bounds = b; view.loadedAt = Date.now();
    if(data.meta && data.meta.name && !ch.name){ ch.name = data.meta.name; save(); }
    paint();
  }catch(e){
    if(seq !== reqSeq) return;
    if(charts) charts.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}
function paint(){
  const ch = view.ch, data = view.data, latest = view.latest; if(!data) return;
  const meta = data.meta || (latest && latest.channel) || {};
  const nums = activeFields(meta).filter(n => !fcfg(ch, n).hidden);
  const loaded = document.getElementById('loaded');
  if(loaded) loaded.textContent = 'Uppdaterad ' + fmtClock(view.loadedAt) + (data.truncated ? ' (urval begränsat, välj medelvärde)' : '');

  // rutor med senaste värden
  let newest = null;
  const tiles = nums.map((n, idx) => {
    const { cur, prev } = lastTwo(latest && latest.feeds, n);
    const f = fcfg(ch, n), d = decOf(ch, n, [cur && cur.v]);
    if(cur && (newest == null || cur.t > newest)) newest = cur.t;
    let trend = '';
    if(cur && prev){
      const diff = cur.v - prev.v, eps = Math.pow(10, -d) / 2;
      trend = Math.abs(diff) < eps ? '→ oförändrat' : (diff > 0 ? '↑ +' : '↓ −') + (Math.abs(diff) < eps ? '' : nf(Math.abs(diff), d));
    }
    const alarm = cur && isAlarm(ch, n, cur.v);
    return `<div class="tile ${alarm ? 'alarm' : ''}" style="--fc:var(--c${((n-1)%8)+1})">
      <div class="lab">${esc(fieldLabel(ch, n, meta))}</div>
      <div class="big num">${cur ? nf(cur.v, d) : '–'}${f.unit ? '<small>' + esc(f.unit) + '</small>' : ''}</div>
      <div class="meta num"><span>${esc(trend)}</span><span>${cur ? esc(ago(cur.t)) : ''}</span></div>
      ${alarm ? `<div class="small" style="color:var(--alarm);margin-top:3px">Utanför gränsen ${f.min != null ? nf(f.min, d) : '–'} … ${f.max != null ? nf(f.max, d) : '–'}</div>` : ''}
    </div>`;
  }).join('');
  const tEl = document.getElementById('tiles'); if(tEl) tEl.innerHTML = tiles;
  const sEl = document.getElementById('stale');
  if(sEl){
    const stale = newest != null && (Date.now() - newest) > (ch.staleMin || 60) * 60e3;
    sEl.innerHTML = stale ? `<div class="stalenote">Ingen ny data sedan ${esc(fmtTime(newest))}. Kontrollera enheten.</div>` : '';
  }

  // grafer
  const cEl = document.getElementById('charts'); if(!cEl) return;
  cEl.innerHTML = nums.map(n => {
    const s = toSeries(data.feeds, n), f = fcfg(ch, n), d = decOf(ch, n, s.map(p => p.v));
    let mn = Infinity, mx = -Infinity, sum = 0;
    s.forEach(p => { if(p.v < mn) mn = p.v; if(p.v > mx) mx = p.v; sum += p.v; });
    const u = f.unit ? ' ' + esc(f.unit) : '';
    const stats = s.length ? `min <b class="num">${nf(mn, d)}</b> · medel <b class="num">${nf(sum/s.length, d)}</b> · max <b class="num">${nf(mx, d)}</b>${u}` : '';
    return `<section class="chart" style="--fc:var(--c${((n-1)%8)+1})">
      <div class="head"><h3><i></i>${esc(fieldLabel(ch, n, meta))}</h3><span class="stats">${stats}</span></div>
      <div class="plot" data-field="${n}"></div></section>`;
  }).join('') || '<p class="empty">Alla fält är dolda. Visa fält under kanalinställningar.</p>';
  cEl.querySelectorAll('.plot').forEach(host => {
    const n = +host.dataset.field, f = fcfg(ch, n), s = toSeries(data.feeds, n);
    drawChart(host, s, { dec: decOf(ch, n, s.map(p => p.v)), unit: f.unit || '', lo: f.min, hi: f.max, color: `var(--c${((n-1)%8)+1})`, t0: view.bounds[0].getTime(), t1: view.bounds[1].getTime() });
  });
}

/* ---------- graf ---------- */
function niceStep(span, count){
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
}
function drawChart(host, pts, o){
  if(!pts.length){ host.innerHTML = '<p class="empty">Ingen data i valt intervall.</p>'; return; }
  const W = Math.max(260, host.clientWidth || 600), H = W < 500 ? 170 : 210;
  const pl = 46, pr = 10, pt = 10, pb = 24;
  let t0 = Math.min(o.t0, pts[0].t), t1 = Math.max(o.t1, pts[pts.length-1].t);
  if(t1 <= t0){ t0 -= 6e4; t1 += 6e4; }
  let vmin = Infinity, vmax = -Infinity;
  pts.forEach(p => { if(p.v < vmin) vmin = p.v; if(p.v > vmax) vmax = p.v; });
  const span0 = Math.max(vmax - vmin, Math.abs(vmax) * 0.02, 1e-6);
  [o.lo, o.hi].forEach(x => { if(x != null && x > vmin - span0 && x < vmax + span0){ vmin = Math.min(vmin, x); vmax = Math.max(vmax, x); } });
  if(vmax - vmin < 1e-9){ vmin -= 1; vmax += 1; }
  const step = niceStep(vmax - vmin, 4);
  const y0 = Math.floor(vmin / step) * step, y1 = Math.ceil(vmax / step) * step;
  const X = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const yd = Math.max(0, -Math.floor(Math.log10(step)));
  let g = '';
  for(let v = y0; v <= y1 + step/2; v += step){
    const y = Y(v).toFixed(1);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${pl-6}" y="${+y+4}" text-anchor="end">${nf(v, Math.min(yd, 3))}</text>`;
  }
  const tspan = t1 - t0, nx = W < 500 ? 3 : 5;
  for(let i = 0; i <= nx; i++){
    const t = t0 + tspan * i / nx, x = X(t);
    const lab = tspan <= 36*3600e3 ? fmtClock(t) : new Date(t).toLocaleDateString('sv-FI', {day:'numeric', month:'numeric'});
    g += `<text class="axis" x="${x.toFixed(1)}" y="${H-6}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${lab}</text>`;
  }
  [o.lo, o.hi].forEach(x => { if(x != null && x >= y0 && x <= y1){ const y = Y(x).toFixed(1); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--alarm)" stroke-width="1.2" stroke-dasharray="5 4"/>`; } });
  // luckor: bryt linjen om avståndet är mycket större än normalt
  const gaps = []; for(let i = 1; i < pts.length; i++) gaps.push(pts[i].t - pts[i-1].t);
  const med = gaps.length ? gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length/2)] : 0;
  let d = '';
  pts.forEach((p, i) => { const brk = i === 0 || (med > 0 && p.t - pts[i-1].t > med * 6); d += (brk ? 'M' : 'L') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); });
  const dots = pts.length <= 60 ? pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="${o.color}"/>`).join('') : '';
  const alarmDots = (o.lo != null || o.hi != null) ? pts.filter(p => (o.lo != null && p.v < o.lo) || (o.hi != null && p.v > o.hi)).slice(0, 400).map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="var(--alarm)"/>`).join('') : '';
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Graf">${g}
    <path d="${d}" fill="none" stroke="${o.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}${alarmDots}
    <line class="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="hit" r="4" fill="${o.color}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/></svg><div class="tip num"></div>`;
  const svg = host.querySelector('svg'), cross = svg.querySelector('.cross'), hit = svg.querySelector('.hit'), tip = host.querySelector('.tip');
  function show(ev){
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    const t = t0 + (px - pl) / (W - pl - pr) * (t1 - t0);
    let lo = 0, hi = pts.length - 1;
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(pts[m].t < t) lo = m; else hi = m; }
    const p = Math.abs(pts[lo].t - t) < Math.abs(pts[hi].t - t) ? pts[lo] : pts[hi];
    const x = X(p.t), y = Y(p.v);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    hit.setAttribute('cx', x); hit.setAttribute('cy', y); hit.setAttribute('visibility', 'visible');
    tip.textContent = nf(p.v, o.dec) + (o.unit ? ' ' + o.unit : '') + '  ' + fmtTime(p.t);
    tip.style.display = 'block';
    const sx = x * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, sx - tw/2), r.width - tw) + 'px';
  }
  function hide(){ cross.setAttribute('visibility', 'hidden'); hit.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; }
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

/* ---------- export ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportCSV(){
  const ch = view.ch, data = view.data; if(!data) return;
  const meta = data.meta || {}, nums = activeFields(meta);
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ['tid'].concat(nums.map(n => fieldLabel(ch, n, meta) + (fcfg(ch, n).unit ? ' (' + fcfg(ch, n).unit + ')' : '')));
  const lines = [head.map(q).join(';')];
  data.feeds.forEach(r => lines.push([q(r.created_at)].concat(nums.map(n => { const v = numIn(r['field'+n]); return v == null ? '' : String(v).replace('.', ','); })).join(';')));
  download(`kanal-${ch.id}-${new Date().toISOString().slice(0,10)}.csv`, '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------- inställningar ---------- */
function openChannelSettings(){
  const ch = view.ch, meta = (view.data && view.data.meta) || (view.latest && view.latest.channel) || {};
  const nums = activeFields(meta);
  const rows = nums.map(n => { const f = fcfg(ch, n); return `
    <div class="frow">
      <input type="checkbox" data-k="show" data-n="${n}" ${f.hidden ? '' : 'checked'} aria-label="Visa fält ${n}">
      <div>
        <div class="small muted" style="margin-bottom:4px">Fält ${n}${meta['field'+n] ? ': ' + esc(meta['field'+n]) : ''}</div>
        <div class="fgrid">
          <label class="f">Namn<input data-k="label" data-n="${n}" value="${esc(f.label || '')}" placeholder="${esc(meta['field'+n] || '')}"></label>
          <label class="f">Enhet<input data-k="unit" data-n="${n}" value="${esc(f.unit || '')}" placeholder="°C"></label>
          <label class="f">Decimaler<input data-k="dec" data-n="${n}" inputmode="numeric" value="${f.dec != null ? f.dec : ''}" placeholder="auto"></label>
          <label class="f">Nedre gräns<input data-k="min" data-n="${n}" inputmode="decimal" value="${f.min != null ? String(f.min).replace('.', ',') : ''}"></label>
          <label class="f">Övre gräns<input data-k="max" data-n="${n}" inputmode="decimal" value="${f.max != null ? String(f.max).replace('.', ',') : ''}"></label>
        </div>
      </div>
    </div>`; }).join('');
  dlgBody.innerHTML = `<h2>Kanalinställningar</h2>
    <div class="grid2">
      <label class="f">Namn<input id="sName" value="${esc(ch.name || '')}"></label>
      <label class="f">Read API Key<input id="sKey" value="${esc(ch.key || '')}" placeholder="bara privata kanaler"></label>
      <label class="f">Varna om ingen data på (min)<input id="sStale" inputmode="numeric" value="${ch.staleMin || 60}"></label>
    </div>
    <div class="fieldset"><div class="small muted">Fält. Värden utanför gränserna markeras med rött.</div>${rows}</div>
    <div class="actions">
      <button class="btn danger" id="sDel" type="button">Ta bort kanal</button>
      <span style="display:flex;gap:8px"><button class="btn" id="sCancel" type="button">Avbryt</button><button class="btn primary" id="sSave" type="button">Spara</button></span>
    </div>`;
  dlg.showModal();
  document.getElementById('sCancel').onclick = () => dlg.close();
  document.getElementById('sDel').onclick = () => {
    if(!confirm('Ta bort kanalen ' + (ch.name || ch.id) + ' från listan?')) return;
    store.channels = store.channels.filter(c => c !== ch); save(); dlg.close(); location.hash = '';
  };
  document.getElementById('sSave').onclick = () => {
    const keyChanged = (document.getElementById('sKey').value.trim() !== (ch.key || ''));
    ch.name = document.getElementById('sName').value.trim();
    ch.key = document.getElementById('sKey').value.trim();
    const sm = numIn(document.getElementById('sStale').value); ch.staleMin = sm && sm > 0 ? sm : 60;
    dlgBody.querySelectorAll('[data-k]').forEach(el => {
      const f = fcfg(ch, el.dataset.n), k = el.dataset.k;
      if(k === 'show') f.hidden = !el.checked;
      else if(k === 'label' || k === 'unit') f[k] = el.value.trim() || undefined;
      else if(k === 'dec'){ const v = numIn(el.value); f.dec = v == null ? undefined : Math.max(0, Math.min(6, Math.round(v))); }
      else f[k] = numIn(el.value) ?? undefined;
    });
    save(); dlg.close(); renderChannel();
    if(keyChanged) loadChannel(false);
  };
}
function openGlobalSettings(){
  const opts = [[0,'Av'],[1,'Varje minut'],[5,'Var 5:e minut'],[15,'Var 15:e minut'],[60,'Varje timme']]
    .map(([v, l]) => `<option value="${v}" ${store.refresh == v ? 'selected' : ''}>${l}</option>`).join('');
  dlgBody.innerHTML = `<h2>Inställningar</h2>
    <label class="f">Uppdatera automatiskt<select id="gRef">${opts}</select></label>
    <div class="fieldset">
      <div class="small muted">Flytta kanaler och inställningar mellan enheter. Filen innehåller dina läsnycklar.</div>
      <div class="row"><button class="btn" id="gExp" type="button">Exportera inställningar</button><button class="btn" id="gImp" type="button">Importera inställningar</button></div>
    </div>
    <div class="actions"><span></span><span style="display:flex;gap:8px"><button class="btn" id="gCancel" type="button">Avbryt</button><button class="btn primary" id="gSave" type="button">Spara</button></span></div>`;
  dlg.showModal();
  document.getElementById('gCancel').onclick = () => dlg.close();
  document.getElementById('gSave').onclick = () => { store.refresh = +document.getElementById('gRef').value || 0; save(); dlg.close(); route(); };
  document.getElementById('gExp').onclick = () => download('kanalvy-installningar.json', JSON.stringify(store, null, 2), 'application/json');
  document.getElementById('gImp').onclick = () => document.getElementById('importFile').click();
}
document.getElementById('importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{
    const o = JSON.parse(await file.text());
    if(!o || !Array.isArray(o.channels)) throw new Error();
    let added = 0;
    o.channels.forEach(c => { if(c && /^\d+$/.test(String(c.id))){ const ex = chById(c.id); if(ex) Object.assign(ex, c); else { store.channels.push(c); added++; } } });
    if(o.refresh != null) store.refresh = +o.refresh || 0;
    save(); dlg.close(); route();
    alert('Importen klar. ' + added + ' nya kanaler, övriga uppdaterade.');
  }catch(err){ alert('Filen kunde inte läsas. Välj en fil som exporterats från Kanalvy.'); }
};

/* ---------- start ---------- */
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(view.ch && view.data) paint(); }, 200); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && store.refresh > 0) (view.ch ? loadChannel(true) : loadListValues()); });
load(); route();
})();
</script>
