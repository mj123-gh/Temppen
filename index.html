<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Temppen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1218" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Temppen</title>
<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --fill:#E4E8EC; --ink:#0F1A22; --muted:#66737E; --hair:rgba(15,26,34,.09);
  --accent:#1B7FA6; --on-accent:#FFFFFF; --alarm:#D94B3D; --warn:#C98204; --ok:#23955F;
  --c1:#1B7FA6; --c2:#7D55C7; --c3:#23955F; --c4:#C98204; --c5:#D94B3D; --c6:#3F63B5; --c7:#9C6A2E; --c8:#2E8C8C;
  --nav:rgba(238,241,244,.82);
  --wx-sun:#F2A900; --wx-moon:#8E9BB0; --wx-cloud:#B4BFC9; --wx-rain:#2F86C9; --wx-snow:#8DB6D6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --card:#151D25; --fill:#1F2933; --ink:#E8EEF2; --muted:#8F9CA7; --hair:rgba(232,238,242,.08);
    --accent:#5BBCE4; --on-accent:#08202B; --alarm:#FF6B5E; --warn:#F2B13C; --ok:#4CCB8C;
    --c1:#5BBCE4; --c2:#B193F0; --c3:#4CCB8C; --c4:#F2B13C; --c5:#FF6B5E; --c6:#8AA6F0; --c7:#D9A867; --c8:#6FCFCF;
    --nav:rgba(12,18,24,.82);
    --wx-sun:#FFC83D; --wx-moon:#C9D3E0; --wx-cloud:#7D8B98; --wx-rain:#5BBCE4; --wx-snow:#D8E8F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --card:#151D25; --fill:#1F2933; --ink:#E8EEF2; --muted:#8F9CA7; --hair:rgba(232,238,242,.08);
  --accent:#5BBCE4; --on-accent:#08202B; --alarm:#FF6B5E; --warn:#F2B13C; --ok:#4CCB8C;
  --c1:#5BBCE4; --c2:#B193F0; --c3:#4CCB8C; --c4:#F2B13C; --c5:#FF6B5E; --c6:#8AA6F0; --c7:#D9A867; --c8:#6FCFCF;
  --nav:rgba(12,18,24,.82);
  --wx-sun:#FFC83D; --wx-moon:#C9D3E0; --wx-cloud:#7D8B98; --wx-rain:#5BBCE4; --wx-snow:#D8E8F5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}

/* navigeringsfält */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px;padding:6px 8px;display:flex;align-items:center;gap:4px;min-height:48px;background:var(--nav);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--hair)}
.nav .mid{flex:1;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .mid{opacity:1}
.navbtn{border:0;background:transparent;color:var(--accent);min-width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 8px;font-size:17px}
.navbtn:active{opacity:.45}
.navbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.side{display:flex;min-width:96px}
.side.r{justify-content:flex-end}
h1.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:4px 0 4px}
.sub{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:15px;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.alarm{background:var(--alarm)} .dot.idle{background:var(--muted)}

/* kanallista */
.ccard{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:22px;padding:16px 18px 14px;margin-bottom:12px;transition:transform .12s}
.ccard:active{transform:scale(.98)}
.ccard .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ccard .t b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .t span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;flex:none}
.ccard .main{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:8px 0 2px}
.ccard .main small{font-size:22px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.ccard .main.alarm{color:var(--alarm)}
.ccard .ml{color:var(--muted);font-size:14px}
.ccard .rest{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:15px}
.ccard .rest span{color:var(--muted)} .ccard .rest b{color:var(--ink);font-weight:600}
.ccard .rest b.alarm{color:var(--alarm)}
.ccard .errline{color:var(--alarm);font-size:14px;margin-top:8px}
.fab{position:fixed;right:max(20px,calc(50vw - 300px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,26,34,.22);z-index:6;transition:transform .12s}
.fab:active{transform:scale(.92)}
.empty{text-align:center;padding:60px 20px 20px;color:var(--muted)}
.empty svg{color:var(--accent);margin-bottom:12px}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 6px}
.empty p{margin:0 auto 22px;max-width:30ch}
.pill{border:0;border-radius:14px;padding:13px 22px;font-weight:600;font-size:17px;background:var(--accent);color:var(--on-accent);min-height:50px}
.pill.soft{background:var(--fill);color:var(--accent)}
.pill:active{opacity:.7}
.pill.block{width:100%}

/* kanalvy: huvudkort */
.hero{background:var(--card);border-radius:26px;padding:20px 20px 6px;margin-bottom:20px}
.hero .lab{font-size:15px;color:var(--muted);font-weight:500}
.hero .big{font-size:76px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:6px 0 8px;display:flex;align-items:flex-start}
.hero .big small{font-size:30px;font-weight:500;letter-spacing:0;color:var(--muted);margin:8px 0 0 4px}
.hero .big.alarm{color:var(--alarm)}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--muted)}
.chip.alarm{background:color-mix(in srgb,var(--alarm) 16%,transparent);color:var(--alarm)}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--hair)}
.hero .row .l{display:flex;align-items:center;gap:10px;min-width:0}
.hero .row .l i{width:10px;height:10px;border-radius:3px;background:var(--fc);flex:none}
.hero .row .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .row .v{text-align:right;flex:none}
.hero .row .v b{font-size:22px;font-weight:600}
.hero .row .v small{color:var(--muted);font-size:15px;margin-left:2px}
.hero .row .v em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.hero .row.alarm .v b,.hero .row.alarm .v em{color:var(--alarm)}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.banner svg{color:var(--warn);flex:none;margin-top:1px}

/* segmentkontroll */
.segwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:4;margin:0 -16px 14px;padding:6px 16px 8px;background:var(--nav);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.seg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--fill);border-radius:11px;padding:2px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/5);background:var(--card);border-radius:9px;box-shadow:0 2px 6px rgba(15,26,34,.12);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.seg button{position:relative;border:0;background:transparent;height:34px;font-size:14px;font-weight:500;z-index:1}
.seg button[aria-pressed="true"]{font-weight:600}
.subctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.selpill{position:relative;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:15px;font-weight:500}
.selpill select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.custom{display:none;gap:10px;margin-top:8px;align-items:end}
.custom.on{display:grid;grid-template-columns:1fr 1fr auto}
.custom label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.custom input{background:var(--card);border:0;border-radius:10px;padding:8px;min-height:38px;width:100%;font-size:15px}
.custom .go{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;min-height:38px;padding:0 14px;font-weight:600}

/* grafer */
.chart{background:var(--card);border-radius:22px;padding:16px 14px 10px;margin-bottom:14px}
.chart h3{margin:0 4px 10px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.chart h3 i{width:10px;height:10px;border-radius:3px;background:var(--fc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 4px 8px}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:19px;font-weight:600;color:var(--ink)}
.plot{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.plot svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:-4px;pointer-events:none;background:var(--ink);color:var(--card);font-size:13px;line-height:1.25;padding:5px 9px;border-radius:9px;white-space:nowrap;display:none;text-align:center}
.tip b{font-size:15px}
.axis{fill:var(--muted);font-size:11px;font-family:-apple-system,system-ui,sans-serif}
.nodata{color:var(--muted);text-align:center;padding:28px 0;margin:0;font-size:15px}
.loading{display:flex;justify-content:center;padding:40px 0;color:var(--muted)}
.loading svg{animation:spin .8s linear infinite}
.err{color:var(--alarm);font-size:15px;margin:8px 0}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}

/* dra för att uppdatera */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);width:36px;height:36px;margin-left:-18px;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(15,26,34,.15);display:grid;place-items:center;color:var(--muted);opacity:0;z-index:7;pointer-events:none;transform:translateY(-30px)}
.ptr.ready{color:var(--accent)}
.ptr.busy{opacity:1;transform:translateY(0);color:var(--accent);transition:transform .2s,opacity .2s}
.ptr.busy svg{animation:spin .8s linear infinite}

/* bottenark */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;overflow:auto;overscroll-behavior:contain}
dialog[open]{animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
dialog::backdrop{background:rgba(5,10,14,.4)}
.sheet{padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 6px;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.shead{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.shead h2{font-size:17px;margin:0;font-weight:600;flex:1;text-align:center}
.shead .navbtn{min-width:72px}
.shead .navbtn.done{font-weight:600}
.ghead{font-size:13px;color:var(--muted);margin:18px 16px 6px}
.gnote{font-size:13px;color:var(--muted);margin:6px 16px 0}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;position:relative}
.grow + .grow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--hair)}
.grow label,.grow > span{flex:1;min-width:0}
.grow input:not([type=checkbox]),.grow select{flex:1.2;min-width:0;border:0;background:transparent;text-align:right;padding:12px 0;font-size:17px;color:var(--ink)}
.grow input::placeholder{color:var(--muted);opacity:.7}
.grow.btnrow{justify-content:center;color:var(--accent);border:0;background:transparent;width:100%;font-size:17px}
.grow.btnrow.danger{color:var(--alarm)}
.grow.btnrow:active{background:var(--fill)}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
.ftitle{display:flex;align-items:center;gap:8px}
.ftitle i{width:10px;height:10px;border-radius:3px;background:var(--fc)}
/* väderkort */
.wx{background:var(--card);border-radius:22px;padding:16px 18px 10px;margin-bottom:16px;overflow:hidden}
.wx .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wx .t b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx .t span{color:var(--muted);font-size:14px;flex:none}
.wxnow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 0}
.wxtemp{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.wxtemp small{font-size:22px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.wxnow svg{flex:none}
.wxdesc{font-size:15px;color:var(--muted)}
.wxdesc b{color:var(--ink);font-weight:600}
.wxrest{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:15px;color:var(--muted)}
.wxrest b{color:var(--ink);font-weight:600}
.wxrest svg{vertical-align:-2px;margin-left:3px}
.wxhours{display:flex;overflow-x:auto;margin:10px -18px 0;padding:10px 10px 8px;border-top:1px solid var(--hair);scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.wxhours::-webkit-scrollbar{display:none}
.wxh{flex:none;width:52px;display:grid;justify-items:center;gap:3px;scroll-snap-align:start;font-size:16px;font-weight:600}
.wxh .tm{color:var(--muted);font-size:13px;font-weight:500}
.wxh .pp{color:var(--wx-rain);font-size:12px;font-weight:600;min-height:15px}
.wxmore{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--hair);background:transparent;padding:11px 0;font-size:15px;font-weight:500;color:var(--accent);text-align:left}
.wxmore svg{transition:transform .2s}
.wxmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.wxdays{border-top:1px solid var(--hair);padding-top:4px}
.wxd{display:grid;grid-template-columns:44px 28px 1fr 32px minmax(48px,84px) 32px;align-items:center;gap:8px;padding:6px 0;font-size:16px}
.wxd + .wxd{border-top:1px solid var(--hair)}
.wxd .dn{font-weight:500}
.wxd .pr{color:var(--wx-rain);font-size:13px;font-weight:600;text-align:left}
.wxd .lo{color:var(--muted);text-align:right}
.wxd .hi{text-align:right;font-weight:600}
.wxbar{position:relative;height:5px;border-radius:3px;background:var(--fill)}
.wxbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--warn))}
.wxfoot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.wxfoot a{color:var(--muted)}
.wx .errline{color:var(--alarm);font-size:14px;margin-top:8px}
.wx .wait{color:var(--muted);font-size:15px;padding:14px 0 8px}
.grow.link{width:100%;border:0;background:transparent;text-align:left;font-size:17px}
.grow.link:active{background:var(--fill)}
.grow.link em{font-style:normal;color:var(--muted);flex:none;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow.link .ch{color:var(--muted);transform:rotate(-90deg);flex:none}
.grow.pick{width:100%;border:0;background:transparent;text-align:left;display:block;padding:10px 16px}
.grow.pick:active{background:var(--fill)}
.grow.pick small{display:block;color:var(--muted);font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;font-size:17px;padding:11px 0;min-width:0}
.search input:focus{outline:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ptr" id="ptr" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></div>
<div class="wrap" id="app"></div>
<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
const API = 'https://api.thingspeak.com';
const LS = 'kanalvy.v1';
const TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'Europe/Helsinki';
const RANGES = [['1h','1 h',3600e3],['24h','24 h',864e5],['7d','7 d',7*864e5],['30d','30 d',30*864e5],['custom','Eget',0]];
const AVGS = [['','Alla mätpunkter'],['10','Medel per 10 min'],['60','Medel per timme'],['240','Medel per 4 h'],['1440','Medel per dygn']];
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');
const dlgBody = document.getElementById('dlgBody');
const ptr = document.getElementById('ptr');
const WX_API = 'https://api.open-meteo.com/v1/forecast';
const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';
const WX_LS = 'temppen.weather.v1';
const WX_TTL = 20 * 60e3;
// Kronoby enligt Open-Meteos geokodning (id 650754)
const WX_DEFAULT = { name: 'Kronoby', area: 'Österbotten, Finland', lat: 63.72859, lon: 23.03387 };

const I = {

function load(){

function cleanPlace(p){
  if(!p || typeof p.name !== 'string' || !p.name) return null;
  const lat = Number(p.lat), lon = Number(p.lon);
  if(!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { name: p.name, area: String(p.area || ''), lat, lon };
}

/* ---------- hjälpare ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numIn = s => { if(s == null) return null; s = String(s).trim().replace(',', '.'); if(s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const nf = (v, d) => (v == null || !isFinite(v)) ? '–' : new Intl.NumberFormat('sv-FI', {minimumFractionDigits:d, maximumFractionDigits:d}).format(v);
const tsParam = d => d.toLocaleString('sv-SE', {timeZone: TZ, hour12: false}).replace('T', ' ');
const fmtTime = t => new Date(t).toLocaleString('sv-FI', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
const fmtClock = t => new Date(t).toLocaleTimeString('sv-FI', {hour:'2-digit', minute:'2-digit'});
function ago(t){
  const s = Math.max(0, (Date.now() - t) / 1000);
  if(s < 60) return 'nyss';
  if(s < 3600) return 'för ' + Math.round(s/60) + ' min sedan';
  if(s < 86400) return 'för ' + Math.round(s/3600) + ' h sedan';
  return 'för ' + Math.round(s/86400) + ' d sedan';
}
function chById(id){ return store.channels.find(c => String(c.id) === String(id)); }
function fcfg(ch, n){ ch.fields = ch.fields || {}; return ch.fields[n] = ch.fields[n] || {}; }
function fieldLabel(ch, n, meta){ const f = fcfg(ch, n); return f.label || (meta && meta['field'+n]) || ('Fält ' + n); }
function decOf(ch, n, vals){
  const f = fcfg(ch, n);
  if(f.dec != null) return f.dec;
  const v = vals && vals.find(x => x != null);
  if(v == null) return 1;
  const a = Math.abs(v);
  return a >= 100 ? 0 : a >= 10 ? 1 : 2;
}
function isAlarm(ch, n, v){ const f = fcfg(ch, n); return v != null && ((f.min != null && v < f.min) || (f.max != null && v > f.max)); }
function activeFields(meta){ const r = []; for(let i = 1; i <= 8; i++) if(meta && meta['field'+i] != null && meta['field'+i] !== '') r.push(i); return r.length ? r : [1]; }
const colorOf = n => `var(--c${((n-1)%8)+1})`;
function unitHtml(u){ return u ? '<small>' + esc(u) + '</small>' : ''; }
function trendOf(cur, prev, d){
  if(!cur || !prev) return '';
  const diff = cur.v - prev.v, eps = Math.pow(10, -d) / 2;
  if(Math.abs(diff) < eps) return '→ oförändrat';
  return (diff > 0 ? '↑ ' : '↓ ') + nf(Math.abs(diff), d);
}

/* ---------- API ---------- */
async function getJSON(url){
  let r;
  try{ r = await fetch(url); }catch(e){ throw new Error('Kunde inte nå ThingSpeak. Kontrollera nätverket.'); }
  if(r.status === 400 || r.status === 401 || r.status === 403) throw new Error('Kanalen är privat eller nyckeln är fel. Ange kanalens Read API Key.');
  if(r.status === 404) throw new Error('Kanalen finns inte. Kontrollera kanal-ID:t.');
  if(!r.ok) throw new Error('ThingSpeak svarade med fel ' + r.status + '.');
  const j = await r.json();
  if(j === -1 || j === '-1') throw new Error('Kanalen är privat eller nyckeln är fel. Ange kanalens Read API Key.');
  return j;
}
function baseParams(ch){ const p = new URLSearchParams({timezone: TZ}); if(ch.key) p.set('api_key', ch.key); return p; }
async function fetchLatest(ch){
  const p = baseParams(ch); p.set('results', '2');
  return getJSON(`${API}/channels/${encodeURIComponent(ch.id)}/feeds.json?${p}`);
}
async function fetchRange(ch, start, end, avg){
  let all = [], meta = null, curEnd = end, pages = 0, truncated = false;
  while(true){
    const p = baseParams(ch);
    p.set('start', tsParam(start)); p.set('end', tsParam(curEnd)); p.set('results', '8000');
    if(avg) p.set('average', avg);
    const j = await getJSON(`${API}/channels/${encodeURIComponent(ch.id)}/feeds.json?${p}`);
    meta = j.channel; const f = j.feeds || [];
    all = f.concat(all); pages++;
    if(avg || f.length < 8000) break;
    if(pages >= 6){ truncated = true; break; }
    const first = new Date(f[0].created_at);
    curEnd = new Date(first.getTime() - 1000);
    if(curEnd <= start) break;
  }
  return { meta, feeds: all, truncated };
}
function toSeries(feeds, n){
  const out = [];
  for(const r of feeds){ const v = numIn(r['field'+n]); if(v != null) out.push({ t: new Date(r.created_at).getTime(), v }); }
  return out;
}
function lastTwo(feeds, n){
  const s = toSeries(feeds || [], n);
  return { cur: s[s.length-1] || null, prev: s[s.length-2] || null };
}

const WMO = {
  0:['Klart','clear'], 1:['Mestadels klart','clear'], 2:['Halvklart','partly'], 3:['Mulet','cloud'],
  45:['Dimma','fog'], 48:['Dimma med rimfrost','fog'],
  51:['Lätt duggregn','drizzle'], 53:['Duggregn','drizzle'], 55:['Tätt duggregn','drizzle'],
  56:['Lätt underkylt duggregn','drizzle'], 57:['Underkylt duggregn','drizzle'],
  61:['Lätt regn','rain'], 63:['Regn','rain'], 65:['Kraftigt regn','rain'],
  66:['Lätt underkylt regn','rain'], 67:['Underkylt regn','rain'],
  71:['Lätt snöfall','snow'], 73:['Snöfall','snow'], 75:['Kraftigt snöfall','snow'], 77:['Snökorn','snow'],
  80:['Lätta regnskurar','showers'], 81:['Regnskurar','showers'], 82:['Kraftiga regnskurar','showers'],
  85:['Lätta snöbyar','snowshowers'], 86:['Kraftiga snöbyar','snowshowers'],
  95:['Åska','thunder'], 96:['Åska med hagel','thunder'], 99:['Kraftig åska med hagel','thunder']
};
const wxText = c => (WMO[c] || ['Okänt väder'])[0];
const WX_CLOUD = 'M10 24a5 5 0 0 1-.5-9.97 7.5 7.5 0 0 1 14.2-1.6 5.8 5.8 0 0 1 .3 11.57z';
function wxIcon(code, day, size){
  const kind = (WMO[code] || [0, 'cloud'])[1];
  const sun = (cx, cy, r) => {
    let rays = '';
    for(let i = 0; i < 8; i++){ const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
      rays += `M${(cx + c*(r+2.5)).toFixed(1)} ${(cy + s*(r+2.5)).toFixed(1)}L${(cx + c*(r+5)).toFixed(1)} ${(cy + s*(r+5)).toFixed(1)}`; }
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--wx-sun)"/><path d="${rays}" stroke="var(--wx-sun)" stroke-width="2" stroke-linecap="round"/>`;
  };
  const moon = (tf) => `<path transform="${tf || ''}" d="M19 5.5a10.5 10.5 0 1 0 8 15.5 8.5 8.5 0 0 1-8-15.5z" fill="var(--wx-moon)"/>`;
  const sky = (small) => small
    ? (day ? sun(11, 10, 4.2) : moon('translate(-4 -3) scale(.75)'))
    : (day ? sun(16, 16, 6) : moon(''));
  const cloud = (tf) => `<path transform="${tf || ''}" d="${WX_CLOUD}" fill="var(--wx-cloud)"/>`;
  const drops = (dots) => dots
    ? `<g fill="var(--wx-rain)"><circle cx="11" cy="27" r="1.4"/><circle cx="16" cy="29" r="1.4"/><circle cx="21" cy="27" r="1.4"/></g>`
    : `<path d="M11.5 24.5l-1.5 4M16.5 24.5l-1.5 4M21.5 24.5l-1.5 4" stroke="var(--wx-rain)" stroke-width="2.2" stroke-linecap="round"/>`;
  const flakes = `<g fill="var(--wx-snow)"><circle cx="10.5" cy="26" r="1.8"/><circle cx="16" cy="29" r="1.8"/><circle cx="21.5" cy="26" r="1.8"/></g>`;
  let g;
  switch(kind){
    case 'clear': g = sky(false); break;
    case 'partly': g = sky(true) + cloud('translate(4 5) scale(.85)'); break;
    case 'fog': g = `<path d="M6 11h20M4 16.5h24M7 22h18" stroke="var(--wx-cloud)" stroke-width="2.6" stroke-linecap="round"/>`; break;
    case 'drizzle': g = cloud('translate(0 -4)') + drops(true); break;
    case 'rain': g = cloud('translate(0 -4)') + drops(false); break;
    case 'snow': g = cloud('translate(0 -4)') + flakes; break;
    case 'showers': g = sky(true) + cloud('translate(4 1) scale(.85)') + drops(false); break;
    case 'snowshowers': g = sky(true) + cloud('translate(4 1) scale(.85)') + flakes; break;
    case 'thunder': g = cloud('translate(0 -5)') + `<path d="M17.5 17.5l-5 7h3.5l-2 6 6-8h-3.5l2.5-5z" fill="var(--wx-sun)"/>`; break;
    default: g = cloud('');
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true">${g}</svg>`;
}
const COMPASS = ['N','NO','O','SO','S','SV','V','NV'];
const compass = d => COMPASS[Math.round(((d % 360) + 360) % 360 / 45) % 8];
// pilen visar vart vinden blåser
const windArrow = d => `<svg width="13" height="13" viewBox="0 0 12 12" style="transform:rotate(${(d + 180) % 360}deg)" aria-hidden="true"><path d="M6 11V1.8M2.4 5.2L6 1.6l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let wx = { data: null, at: 0, key: '', err: null, seq: 0 };
const placeKey = p => p.lat.toFixed(4) + ',' + p.lon.toFixed(4);
function wxReadCache(){
  try{ const o = JSON.parse(localStorage.getItem(WX_LS)); if(o && o.data && o.key) return o; }catch(e){}
  return null;
}
function wxWriteCache(){ try{ localStorage.setItem(WX_LS, JSON.stringify({ at: wx.at, key: wx.key, data: wx.data })); }catch(e){} }
function wxUrl(p){
  const q = new URLSearchParams({
    latitude: p.lat, longitude: p.lon, models: 'metno_seamless',
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day',
    hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset',
    wind_speed_unit: 'ms', timezone: 'auto', forecast_days: '7', timeformat: 'unixtime'
  });
  return WX_API + '?' + q;
}
async function loadWeather(force){
  const p = store.weather, key = placeKey(p);
  if(wx.key !== key){
    const c = wxReadCache();
    wx = { data: c && c.key === key ? c.data : null, at: c && c.key === key ? c.at : 0, key, err: null, seq: wx.seq };
  }
  renderWeather();
  if(Date.now() - wx.at < (force ? 60e3 : WX_TTL)) return;
  const seq = ++wx.seq;
  try{
    let r;
    try{ r = await fetch(wxUrl(p)); }catch(e){ throw new Error('Kunde inte nå Open-Meteo.'); }
    if(!r.ok) throw new Error('Open-Meteo svarade med fel ' + r.status + '.');
    const j = await r.json();
    if(!j || !j.current || !j.hourly || !j.daily) throw new Error('Oväntat svar från Open-Meteo.');
    if(seq !== wx.seq || wx.key !== key) return;
    wx.data = j; wx.at = Date.now(); wx.err = null; wxWriteCache();
  }catch(e){
    if(seq !== wx.seq || wx.key !== key) return;
    wx.err = e.message || 'Kunde inte hämta vädret.';
  }
  renderWeather();
}
function renderWeather(){
  const el = document.getElementById('wx'); if(!el) return;
  try{ paintWeather(el); }
  catch(e){ el.innerHTML = `<div class="t"><b>${esc(store.weather.name)}</b></div><div class="errline">Vädret kunde inte visas.</div>`; }
}
function paintWeather(el){
  const p = store.weather, j = wx.data;
  const credit = `<div class="wxfoot"><a href="https://open-meteo.com/" target="_blank" rel="noopener">Väderdata: Open-Meteo.com</a>${j ? `<span>Uppdaterad ${esc(fmtClock(wx.at))}</span>` : ''}</div>`;
  if(!j){
    el.innerHTML = `<div class="t"><b>${esc(p.name)}</b></div>` +
      (wx.err ? `<div class="errline">${esc(wx.err)}</div>` : '<div class="wait">Hämtar väder …</div>') + credit;
    return;
  }
  const tz = j.timezone || TZ, c = j.current, h = j.hourly, d = j.daily;
  const clock = t => new Date(t * 1000).toLocaleTimeString('sv-FI', { hour: '2-digit', minute: '2-digit', timeZone: tz });
  const deg = (v, n) => v == null ? '–' : nf(v, n) + '°';

  // timremsa: från innevarande timme och 24 timmar framåt
  const nowS = Date.now() / 1000;
  let i0 = h.time.findIndex(t => t + 3600 > nowS); if(i0 < 0) i0 = 0;
  const hours = [];
  for(let i = i0; i < Math.min(h.time.length, i0 + 25); i++){
    const first = i === i0, pp = h.precipitation_probability ? h.precipitation_probability[i] : null;
    const hh = new Date(h.time[i] * 1000).toLocaleTimeString('sv-FI', { hour: '2-digit', timeZone: tz });
    hours.push(`<div class="wxh"><span class="tm">${first ? 'Nu' : esc(hh)}</span>${wxIcon(first ? c.weather_code : h.weather_code[i], first ? c.is_day : h.is_day[i], 28)}<span class="num">${deg(first ? c.temperature_2m : h.temperature_2m[i], 0)}</span><span class="pp num">${pp != null && pp >= 20 ? pp + ' %' : ''}</span></div>`);
  }

  // dagar
  const lo = Math.min(...d.temperature_2m_min.filter(v => v != null)), hi = Math.max(...d.temperature_2m_max.filter(v => v != null));
  const spanT = Math.max(1, hi - lo);
  const days = d.time.map((t, i) => {
    const dn = i === 0 ? 'Idag' : new Date(t * 1000).toLocaleDateString('sv-FI', { weekday: 'short', timeZone: tz }).replace('.', '');
    const mn = d.temperature_2m_min[i], mx = d.temperature_2m_max[i], ps = d.precipitation_sum[i];
    const bar = mn != null && mx != null ? `<i style="left:${((mn - lo) / spanT * 100).toFixed(1)}%;right:${((hi - mx) / spanT * 100).toFixed(1)}%"></i>` : '';
    return `<div class="wxd"><span class="dn">${esc(dn.charAt(0).toUpperCase() + dn.slice(1))}</span>${wxIcon(d.weather_code[i], 1, 26)}<span class="pr num">${ps != null && ps >= 0.1 ? nf(ps, 1) + ' mm' : ''}</span><span class="lo num">${deg(mn, 0)}</span><span class="wxbar">${bar}</span><span class="hi num">${deg(mx, 0)}</span></div>`;
  }).join('');

  const sunTxt = d.sunrise && d.sunrise[0] ? `<span>Sol <b class="num">${esc(clock(d.sunrise[0]))}–${esc(clock(d.sunset[0]))}</b></span>` : '';
  el.innerHTML = `
    <div class="t"><b>${esc(p.name)}</b><span>${esc(wxText(c.weather_code))}</span></div>
    <div class="wxnow">
      <div>
        <div class="wxtemp num">${nf(c.temperature_2m, 1)}<small>°C</small></div>
        <div class="wxdesc">Känns som <b class="num">${deg(c.apparent_temperature, 0)}</b></div>
      </div>
      ${wxIcon(c.weather_code, c.is_day, 64)}
    </div>
    <div class="wxrest">
      <span>Vind <b class="num">${nf(c.wind_speed_10m, 0)} m/s</b> ${esc(compass(c.wind_direction_10m))}${windArrow(c.wind_direction_10m)}</span>
      <span>Byar <b class="num">${nf(c.wind_gusts_10m, 0)} m/s</b></span>
      <span>Nederbörd <b class="num">${nf(c.precipitation, 1)} mm</b></span>
      <span>Fukt <b class="num">${nf(c.relative_humidity_2m, 0)} %</b></span>
      ${sunTxt}
    </div>
    ${wx.err ? `<div class="errline">${esc(wx.err)} Visar väder från ${esc(fmtTime(wx.at))}.</div>` : ''}
    <div class="wxhours">${hours.join('')}</div>
    <button class="wxmore" id="wxMore" type="button" aria-expanded="${!!store.wxDays}">Prognos ${d.time.length} dagar${I.chev}</button>
    ${store.wxDays ? `<div class="wxdays">${days}</div>` : ''}
    ${credit}`;
  document.getElementById('wxMore').onclick = () => { store.wxDays = !store.wxDays; save(); renderWeather(); };
}
function openPlaceSheet(){
  dlgBody.innerHTML = `<div class="grab"></div>
    <div class="shead"><button class="navbtn" id="pBack" style="padding-left:4px">${I.back}<span style="margin-left:5px">Tillbaka</span></button><h2>Plats för väder</h2><span style="min-width:72px"></span></div>
    <label class="search">${I.search}<input id="pQ" type="search" placeholder="Sök ort" autocomplete="off" enterkeyhint="search"></label>
    <div id="pRes"></div>
    <p class="gnote">Nu: ${esc(store.weather.name)}${store.weather.area ? ', ' + esc(store.weather.area) : ''}. Sökningen görs hos Open-Meteo.</p>`;
  if(!dlg.open) openSheet(); else setTimeout(() => document.getElementById('pQ').focus(), 50);
  document.getElementById('pBack').onclick = openGlobalSettings;
  const q = document.getElementById('pQ'), res = document.getElementById('pRes');
  let t = null, seq = 0, found = [];
  q.oninput = () => {
    clearTimeout(t);
    const s = q.value.trim();
    if(s.length < 2){ res.innerHTML = ''; return; }
    t = setTimeout(async () => {
      const my = ++seq;
      try{
        const r = await fetch(`${GEO_API}?${new URLSearchParams({ name: s, count: '8', language: 'sv', format: 'json' })}`);
        if(!r.ok) throw new Error();
        const j = await r.json();
        if(my !== seq) return;
        found = (j.results || []).filter(x => isFinite(x.latitude) && isFinite(x.longitude));
        res.innerHTML = found.length
          ? '<div class="group">' + found.map((x, i) => `<button class="grow pick" type="button" data-i="${i}">${esc(x.name)}<small>${esc([x.admin1, x.country].filter(Boolean).join(', '))}</small></button>`).join('') + '</div>'
          : '<p class="gnote">Hittade ingen ort med det namnet.</p>';
        res.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
          const x = found[+b.dataset.i];
          store.weather = { name: x.name, area: [x.admin1, x.country].filter(Boolean).join(', '), lat: x.latitude, lon: x.longitude };
          save(); loadWeather(false); openGlobalSettings();
        });
      }catch(e){ if(my === seq) res.innerHTML = '<p class="err">Kunde inte söka. Kontrollera nätverket.</p>'; }
    }, 300);
  };
}

/* ---------- routing ---------- */
function route(){
  clearInterval(timer); timer = null;
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('ch')){
    const ch = chById(h.slice(2));
    if(ch){ if(!view.ch || view.ch.id !== ch.id){ view.data = null; view.latest = null; } view.ch = ch; renderChannel(); startTimer(); window.scrollTo(0, 0); return; }
  }
  view.ch = null; renderList(); startTimer(); window.scrollTo(0, 0);
}
function startTimer(){
  if(store.refresh > 0) timer = setInterval(refreshNow, store.refresh * 60e3);
}
// manual = användaren bad om det (knapp eller dra), då hämtas vädret även om cachen är färsk
async function refreshNow(manual){
  if(busy) return;
  busy = true;
  const rb = document.getElementById('rbtn'); if(rb) rb.classList.add('spin');
  try{ await (view.ch ? loadChannel(true) : Promise.all([loadListValues(), loadWeather(manual === true)])); }
  finally{ busy = false; const r2 = document.getElementById('rbtn'); if(r2) r2.classList.remove('spin'); }
}
function navScroll(){ const n = document.querySelector('.nav'); if(n) n.classList.toggle('scrolled', window.scrollY > 40); }
window.addEventListener('scroll', navScroll, {passive:true});

async function addChannel(id, key, name, errEl){
  const fail = m => { if(errEl){ errEl.textContent = m; errEl.hidden = false; } else alert(m); };
  id = String(id || '').trim(); key = String(key || '').trim(); name = String(name || '').trim();
  if(!/^\d+$/.test(id)) return fail('Kanal-ID ska vara ett nummer.');
  if(chById(id)) return fail('Kanalen finns redan i listan.');
  const ch = { id, key, name, fields: {}, staleMin: 60 };
  try{
    const j = await fetchLatest(ch);
    if(!name && j.channel && j.channel.name) ch.name = j.channel.name;
  }catch(e){ return fail(e.message); }
  store.channels.push(ch); save();
  if(dlg.open) dlg.close();
  renderList();
}
function loadListValues(){
  return Promise.all(store.channels.map(ch => {
    const row = document.getElementById('row-' + ch.id); if(!row) return null;
    return fetchLatest(ch).then(j => {
      const meta = j.channel, feeds = j.feeds || [];
      const nums = activeFields(meta).filter(n => !fcfg(ch, n).hidden);
      let newest = null, alarm = false;
      const vals = nums.map(n => {
        const { cur } = lastTwo(feeds, n), f = fcfg(ch, n);
        if(cur && (newest == null || cur.t > newest)) newest = cur.t;
        const a = cur && isAlarm(ch, n, cur.v); if(a) alarm = true;
        return { n, cur, a, f, label: fieldLabel(ch, n, meta), d: decOf(ch, n, [cur && cur.v]) };
      });
      const [first, ...rest] = vals;
      let html = '';
      if(first){
        html += `<div class="main num ${first.a ? 'alarm' : ''}">${first.cur ? nf(first.cur.v, first.d) : '–'}${unitHtml(first.f.unit)}</div><div class="ml">${esc(first.label)}</div>`;
      }
      if(rest.length){
        html += '<div class="rest">' + rest.map(x => `<span>${esc(x.label)} <b class="num ${x.a ? 'alarm' : ''}">${x.cur ? nf(x.cur.v, x.d) : '–'}${x.f.unit ? ' ' + esc(x.f.unit) : ''}</b></span>`).join('') + '</div>';
      }
      row.querySelector('.body').innerHTML = html;
      const stale = newest != null && (Date.now() - newest) > (ch.staleMin || 60) * 60e3;
      row.querySelector('.age').textContent = newest ? ago(newest) : 'ingen data';
      row.querySelector('.dot').className = 'dot ' + (alarm ? 'alarm' : stale || newest == null ? 'warn' : '');
    }).catch(e => {
      row.querySelector('.age').textContent = 'fel';
      row.querySelector('.dot').className = 'dot alarm';
      row.querySelector('.body').innerHTML = `<div class="errline">${esc(e.message)}</div>`;
    });
  }));
}

      <div class="mid">${esc(title)}</div>

      <div class="subctl">

      </div>

        <label>Till<input type="datetime-local" id="cEnd" value="${esc(view.cEnd)}"></label>
        <button class="go" id="cGo" type="button">Visa</button>

  document.getElementById('cset').onclick = openChannelSettings;
  document.getElementById('avg').onchange = e => { view.avg = e.target.value; document.getElementById('avgLab').textContent = AVGS.find(a => a[0] === view.avg)[1]; loadChannel(false); };
  moveThumb();
  app.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    view.range = b.dataset.range;
    app.querySelectorAll('[data-range]').forEach(x => x.setAttribute('aria-pressed', x === b));
    moveThumb();
    document.getElementById('custom').classList.toggle('on', view.range === 'custom');
    if(view.range === 'custom'){
      if(!view.cStart){ const e = new Date(), s = new Date(Date.now() - 3*864e5); view.cStart = localInput(s); view.cEnd = localInput(e); document.getElementById('cStart').value = view.cStart; document.getElementById('cEnd').value = view.cEnd; }
      return;
    }
    loadChannel(false);
  });
  document.getElementById('cGo').onclick = () => { view.cStart = document.getElementById('cStart').value; view.cEnd = document.getElementById('cEnd').value; loadChannel(false); };
  navScroll();
  if(view.data) paint();
  loadChannel(!!view.data);

function moveThumb(){
  const i = RANGES.findIndex(r => r[0] === view.range);
  const th = document.getElementById('thumb'); if(th) th.style.transform = `translateX(${i * 100}%)`;
}
function localInput(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function rangeBounds(){
  if(view.range === 'custom'){
    const s = new Date(view.cStart), e = new Date(view.cEnd);
    if(isNaN(s) || isNaN(e) || e <= s) return null;
    return [s, e];
  }
  const ms = RANGES.find(r => r[0] === view.range)[2];
  const e = new Date(); return [new Date(e.getTime() - ms), e];
}
async function loadChannel(quiet){
  const ch = view.ch; if(!ch) return;
  const b = rangeBounds();
  const charts = document.getElementById('charts');
  if(!b){ charts.innerHTML = '<p class="err">Välj ett intervall där Till är senare än Från.</p>'; return; }
  if(!quiet && charts) charts.innerHTML = `<div class="loading">${I.refresh}</div>`;
  const seq = ++reqSeq;
  try{
    const [latest, data] = await Promise.all([fetchLatest(ch), fetchRange(ch, b[0], b[1], view.avg)]);
    if(seq !== reqSeq || view.ch !== ch) return;
    view.latest = latest; view.data = data; view.bounds = b; view.loadedAt = Date.now();
    if(data.meta && data.meta.name && !ch.name){ ch.name = data.meta.name; save(); }
    paint();
  }catch(e){
    if(seq !== reqSeq) return;
    const c = document.getElementById('charts'); if(c) c.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    const s = document.getElementById('sub'); if(s) s.innerHTML = `<i class="dot alarm"></i><span>Kunde inte hämta data</span>`;
  }
}
function paint(){
  const ch = view.ch, data = view.data, latest = view.latest; if(!data) return;
  const meta = data.meta || (latest && latest.channel) || {};
  const nums = activeFields(meta).filter(n => !fcfg(ch, n).hidden);

  let newest = null, anyAlarm = false;
  const vals = nums.map(n => {
    const { cur, prev } = lastTwo(latest && latest.feeds, n), f = fcfg(ch, n), d = decOf(ch, n, [cur && cur.v]);
    if(cur && (newest == null || cur.t > newest)) newest = cur.t;
    const a = cur && isAlarm(ch, n, cur.v); if(a) anyAlarm = true;
    return { n, cur, prev, f, d, a, label: fieldLabel(ch, n, meta) };
  });
  const stale = newest != null && (Date.now() - newest) > (ch.staleMin || 60) * 60e3;

  const sub = document.getElementById('sub');
  if(sub) sub.innerHTML = `<i class="dot ${anyAlarm ? 'alarm' : stale || newest == null ? 'warn' : ''}"></i><span>${newest ? 'Senaste mätning ' + esc(ago(newest)) : 'Ingen data ännu'}</span>`;
  const sEl = document.getElementById('stale');
  if(sEl) sEl.innerHTML = stale ? `<div class="banner">${I.warn}<span>Ingen ny data sedan ${esc(fmtTime(newest))}. Kontrollera enheten.</span></div>` : '';

  const hero = document.getElementById('hero');
  if(hero){
    if(!vals.length){ hero.innerHTML = ''; }
    else{
      const [h, ...rest] = vals;
      const lim = h.a ? `<span class="chip alarm">Utanför ${h.f.min != null ? nf(h.f.min, h.d) : '–'} … ${h.f.max != null ? nf(h.f.max, h.d) : '–'}</span>` : '';
      const tr = trendOf(h.cur, h.prev, h.d);
      hero.innerHTML = `<div class="hero" style="--fc:${colorOf(h.n)}">
        <div class="lab">${esc(h.label)}</div>
        <div class="big num ${h.a ? 'alarm' : ''}">${h.cur ? nf(h.cur.v, h.d) : '–'}${unitHtml(h.f.unit)}</div>
        <div class="chips">${tr ? `<span class="chip num">${esc(tr)}</span>` : ''}${lim}</div>
        ${rest.map(x => `<div class="row ${x.a ? 'alarm' : ''}" style="--fc:${colorOf(x.n)}">
            <div class="l"><i></i><span>${esc(x.label)}</span></div>
            <div class="v num"><b>${x.cur ? nf(x.cur.v, x.d) : '–'}</b>${unitHtml(x.f.unit)}<em>${x.a ? 'Utanför gränsen' : esc(trendOf(x.cur, x.prev, x.d))}</em></div>
          </div>`).join('')}
        ${rest.length ? '' : '<div style="height:8px"></div>'}
      </div>`;
    }
  }

  const foot = document.getElementById('foot');
  if(foot) foot.textContent = 'Uppdaterad ' + fmtClock(view.loadedAt) + (data.truncated ? '. Långt intervall, välj medelvärde för att se allt.' : '');

  const cEl = document.getElementById('charts'); if(!cEl) return;
  cEl.innerHTML = vals.map(x => {
    const s = toSeries(data.feeds, x.n), d = decOf(ch, x.n, s.map(p => p.v));
    let mn = Infinity, mx = -Infinity, sum = 0;
    s.forEach(p => { if(p.v < mn) mn = p.v; if(p.v > mx) mx = p.v; sum += p.v; });
    const stats = s.length ? `<div class="stats num"><div>Lägst<b>${nf(mn, d)}</b></div><div>Medel<b>${nf(sum/s.length, d)}</b></div><div>Högst<b>${nf(mx, d)}</b></div></div>` : '';
    return `<section class="chart" style="--fc:${colorOf(x.n)}">
      <h3><i></i>${esc(x.label)}${x.f.unit ? ' <span style="color:var(--muted);font-weight:400">' + esc(x.f.unit) + '</span>' : ''}</h3>
      ${stats}<div class="plot" data-field="${x.n}"></div></section>`;
  }).join('') || '<p class="nodata">Alla fält är dolda. Visa dem i kanalinställningarna.</p>';
  cEl.querySelectorAll('.plot').forEach(host => {
    const n = +host.dataset.field, f = fcfg(ch, n), s = toSeries(data.feeds, n);
    drawChart(host, s, { id: n, dec: decOf(ch, n, s.map(p => p.v)), unit: f.unit || '', lo: f.min, hi: f.max, color: colorOf(n), t0: view.bounds[0].getTime(), t1: view.bounds[1].getTime() });
  });
}

/* ---------- graf ---------- */
function niceStep(span, count){
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
}
function drawChart(host, pts, o){
  if(!pts.length){ host.innerHTML = '<p class="nodata">Ingen data i valt intervall.</p>'; return; }
  const W = Math.max(260, host.clientWidth || 340), H = W < 500 ? 180 : 220;
  const pl = 6, pr = 40, pt = 12, pb = 22;
  let t0 = Math.min(o.t0, pts[0].t), t1 = Math.max(o.t1, pts[pts.length-1].t);
  if(t1 <= t0){ t0 -= 6e4; t1 += 6e4; }
  let vmin = Infinity, vmax = -Infinity;
  pts.forEach(p => { if(p.v < vmin) vmin = p.v; if(p.v > vmax) vmax = p.v; });
  const span0 = Math.max(vmax - vmin, Math.abs(vmax) * 0.02, 1e-6);
  [o.lo, o.hi].forEach(x => { if(x != null && x > vmin - span0 && x < vmax + span0){ vmin = Math.min(vmin, x); vmax = Math.max(vmax, x); } });
  if(vmax - vmin < 1e-9){ vmin -= 1; vmax += 1; }
  const step = niceStep(vmax - vmin, 3);
  const y0 = Math.floor(vmin / step) * step, y1 = Math.ceil(vmax / step) * step;
  const X = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const yd = Math.max(0, -Math.floor(Math.log10(step)));
  let g = '';
  for(let v = y0; v <= y1 + step/2; v += step){
    const y = Y(v).toFixed(1);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--hair)" stroke-width="1"/><text class="axis" x="${W-pr+6}" y="${+y+4}">${nf(v, Math.min(yd, 3))}</text>`;
  }
  const tspan = t1 - t0, nx = W < 500 ? 3 : 4;
  for(let i = 0; i <= nx; i++){
    const t = t0 + tspan * i / nx, x = X(t);
    const lab = tspan <= 36*3600e3 ? fmtClock(t) : new Date(t).toLocaleDateString('sv-FI', {day:'numeric', month:'numeric'});
    g += `<text class="axis" x="${x.toFixed(1)}" y="${H-4}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${lab}</text>`;
  }
  [o.lo, o.hi].forEach(x => { if(x != null && x >= y0 && x <= y1){ const y = Y(x).toFixed(1); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--alarm)" stroke-width="1.3" stroke-dasharray="4 4" opacity=".8"/>`; } });
  const gaps = []; for(let i = 1; i < pts.length; i++) gaps.push(pts[i].t - pts[i-1].t);
  const med = gaps.length ? gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length/2)] : 0;
  const segs = []; let curSeg = [];
  pts.forEach((p, i) => { if(i > 0 && med > 0 && p.t - pts[i-1].t > med * 6){ segs.push(curSeg); curSeg = []; } curSeg.push(p); });
  segs.push(curSeg);
  const base = (H - pb).toFixed(1);
  let line = '', area = '';
  segs.forEach(sg => {
    const d = sg.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
    line += d;
    if(sg.length > 1) area += d + `L${X(sg[sg.length-1].t).toFixed(1)} ${base}L${X(sg[0].t).toFixed(1)} ${base}Z`;
  });
  const gid = 'g' + o.id + '_' + Math.random().toString(36).slice(2, 7);
  const dots = pts.length <= 40 ? pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.4" fill="${o.color}"/>`).join('') : '';
  const alarmDots = (o.lo != null || o.hi != null) ? pts.filter(p => (o.lo != null && p.v < o.lo) || (o.hi != null && p.v > o.hi)).slice(0, 400).map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.8" fill="var(--alarm)"/>`).join('') : '';
  const last = pts[pts.length-1];
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Graf">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${o.color};stop-opacity:.28"/><stop offset="1" style="stop-color:${o.color};stop-opacity:0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${o.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${alarmDots}
    <circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4" fill="${o.color}" stroke="var(--card)" stroke-width="2"/>
    <line class="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="hit" r="5" fill="${o.color}" stroke="var(--card)" stroke-width="2.5" visibility="hidden"/></svg><div class="tip num"></div>`;
  const svg = host.querySelector('svg'), cross = svg.querySelector('.cross'), hit = svg.querySelector('.hit'), tip = host.querySelector('.tip');
  function show(ev){
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    const t = t0 + (px - pl) / (W - pl - pr) * (t1 - t0);
    let lo = 0, hi = pts.length - 1;
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(pts[m].t < t) lo = m; else hi = m; }
    const p = Math.abs(pts[lo].t - t) < Math.abs(pts[hi].t - t) ? pts[lo] : pts[hi];
    const x = X(p.t), y = Y(p.v);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    hit.setAttribute('cx', x); hit.setAttribute('cy', y); hit.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${esc(nf(p.v, o.dec))}${o.unit ? ' ' + esc(o.unit) : ''}</b><br>${esc(fmtTime(p.t))}`;
    tip.style.display = 'block';
    const sx = x * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, sx - tw/2), r.width - tw) + 'px';
    tip.style.top = (-tip.offsetHeight - 4) + 'px';
  }
  function hide(){ cross.setAttribute('visibility', 'hidden'); hit.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; }
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('pointercancel', hide);
}

/* ---------- ark (bottom sheets) ---------- */
function openSheet(){
  dlg.showModal();
  const first = dlgBody.querySelector('input:not([type=checkbox])');
  if(first && !first.value) setTimeout(() => first.focus(), 350);
}
dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });

function openChannelSettings(){
  const ch = view.ch, meta = (view.data && view.data.meta) || (view.latest && view.latest.channel) || {};
  const nums = activeFields(meta);
  const val = v => v != null ? String(v).replace('.', ',') : '';
  const groups = nums.map(n => { const f = fcfg(ch, n); return `
    <div class="ghead ftitle" style="--fc:${colorOf(n)}"><i></i>Fält ${n}${meta['field'+n] ? ', ' + esc(meta['field'+n]) : ''}</div>
    <div class="group">
      <div class="grow"><span>Visa</span><input type="checkbox" class="switch" data-k="show" data-n="${n}" ${f.hidden ? '' : 'checked'}></div>
      <div class="grow"><span>Namn</span><input data-k="label" data-n="${n}" value="${esc(f.label || '')}" placeholder="${esc(meta['field'+n] || 'Fält ' + n)}"></div>
      <div class="grow"><span>Enhet</span><input data-k="unit" data-n="${n}" value="${esc(f.unit || '')}" placeholder="t.ex. °C"></div>
      <div class="grow"><span>Decimaler</span><input data-k="dec" data-n="${n}" inputmode="numeric" value="${f.dec != null ? f.dec : ''}" placeholder="Auto"></div>
      <div class="grow"><span>Nedre gräns</span><input data-k="min" data-n="${n}" inputmode="decimal" value="${val(f.min)}" placeholder="Ingen"></div>
      <div class="grow"><span>Övre gräns</span><input data-k="max" data-n="${n}" inputmode="decimal" value="${val(f.max)}" placeholder="Ingen"></div>
    </div>`; }).join('');
  dlgBody.innerHTML = `<div class="grab"></div>
    <div class="shead"><button class="navbtn" id="sCancel">Avbryt</button><h2>Kanalinställningar</h2><button class="navbtn done" id="sSave">Klar</button></div>
    <div class="group">
      <div class="grow"><span>Namn</span><input id="sName" value="${esc(ch.name || '')}" placeholder="Kanal ${esc(ch.id)}"></div>
      <div class="grow"><span>Läsnyckel</span><input id="sKey" value="${esc(ch.key || '')}" placeholder="Bara privata" autocapitalize="characters" spellcheck="false"></div>
      <div class="grow"><span>Varna efter</span><input id="sStale" inputmode="numeric" value="${ch.staleMin || 60}" style="flex:.6"><span style="flex:none;color:var(--muted)">min utan data</span></div>
    </div>
    <p class="gnote">Kanal-ID ${esc(ch.id)}. Värden utanför gränserna visas i rött.</p>
    ${groups}
    <div style="height:24px"></div>
    <div class="group"><button class="grow btnrow danger" id="sDel">Ta bort kanal</button></div>`;
  openSheet();
  document.getElementById('sCancel').onclick = () => dlg.close();
  document.getElementById('sDel').onclick = () => {
    if(!confirm('Ta bort ' + (ch.name || 'kanal ' + ch.id) + ' från appen?')) return;
    store.channels = store.channels.filter(c => c !== ch); save(); dlg.close(); location.hash = '';
  };
  document.getElementById('sSave').onclick = () => {
    const keyChanged = (document.getElementById('sKey').value.trim() !== (ch.key || ''));
    ch.name = document.getElementById('sName').value.trim();
    ch.key = document.getElementById('sKey').value.trim();
    const sm = numIn(document.getElementById('sStale').value); ch.staleMin = sm && sm > 0 ? sm : 60;
    dlgBody.querySelectorAll('[data-k]').forEach(el => {
      const f = fcfg(ch, el.dataset.n), k = el.dataset.k;
      if(k === 'show') f.hidden = !el.checked;
      else if(k === 'label' || k === 'unit') f[k] = el.value.trim() || undefined;
      else if(k === 'dec'){ const v = numIn(el.value); f.dec = v == null ? undefined : Math.max(0, Math.min(6, Math.round(v))); }
      else f[k] = numIn(el.value) ?? undefined;
    });
    save(); dlg.close(); renderChannel();
    if(keyChanged) loadChannel(false);
  };
}
function openGlobalSettings(){
  const opts = [[0,'Av'],[1,'Varje minut'],[5,'Var 5:e minut'],[15,'Var 15:e minut'],[60,'Varje timme']]
    .map(([v, l]) => `<option value="${v}" ${store.refresh == v ? 'selected' : ''}>${l}</option>`).join('');
  dlgBody.innerHTML = `<div class="grab"></div>
    <div class="shead"><button class="navbtn" id="gCancel">Avbryt</button><h2>Inställningar</h2><button class="navbtn done" id="gSave">Klar</button></div>
    <div class="group"><div class="grow"><span>Uppdatera automatiskt</span><select id="gRef">${opts}</select></div></div>
    <p class="gnote">Appen hämtar också ny data varje gång du öppnar den.</p>
    <div class="ghead">Väder</div>
    <div class="group"><button class="grow link" id="gPlace" type="button"><span>Plats</span><em>${esc(store.weather.name)}</em><span class="ch">${I.chev}</span></button></div>
    <p class="gnote">Prognosen kommer från Open-Meteo (MET Norways nordiska modell).</p>
    <div class="ghead">Säkerhetskopia</div>
    <div class="group">
      <button class="grow btnrow" id="gExp" type="button">Spara kopia av inställningarna</button>
      <button class="grow btnrow" id="gImp" type="button">Läs in inställningar</button>
    </div>
    <p class="gnote">Kopian innehåller kanaler och läsnycklar. Använd den för att flytta inställningarna till en annan enhet.</p>`;
  openSheet();
  document.getElementById('gCancel').onclick = () => dlg.close();
  document.getElementById('gSave').onclick = () => { store.refresh = +document.getElementById('gRef').value || 0; save(); dlg.close(); route(); };
  document.getElementById('gPlace').onclick = openPlaceSheet;
  document.getElementById('gExp').onclick = exportSettings;
  document.getElementById('gImp').onclick = () => document.getElementById('importFile').click();
}
async function exportSettings(){
  const text = JSON.stringify(store, null, 2), name = 'temppen-installningar.json';
  try{
    const file = new File([text], name, {type: 'application/json'});
    if(navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.getElementById('importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{
    const o = JSON.parse(await file.text());
    if(!o || !Array.isArray(o.channels)) throw new Error();
    let added = 0;
    o.channels.forEach(c => { if(c && /^\d+$/.test(String(c.id))){ const ex = chById(c.id); if(ex) Object.assign(ex, c); else { store.channels.push(c); added++; } } });
    if(o.refresh != null) store.refresh = +o.refresh || 0;
    const pl = cleanPlace(o.weather); if(pl) store.weather = pl;
    save(); dlg.close(); route();
    alert('Inställningarna är inlästa. ' + added + ' nya kanaler.');
  }catch(err){ alert('Filen kunde inte läsas. Välj en kopia som sparats från appen.'); }
};

/* ---------- dra för att uppdatera ---------- */
let pY = null, pD = 0;
document.addEventListener('touchstart', e => { pY = (window.scrollY <= 0 && !dlg.open && !e.target.closest('.plot')) ? e.touches[0].clientY : null; pD = 0; }, {passive:true});
document.addEventListener('touchmove', e => {
  if(pY == null || busy) return;
  pD = e.touches[0].clientY - pY;
  if(pD <= 0){ ptr.style.opacity = 0; return; }
  const k = Math.min(pD, 110);
  ptr.style.opacity = Math.min(1, k / 70);
  ptr.style.transform = `translateY(${k * 0.5 - 30}px) rotate(${k * 3}deg)`;
  ptr.classList.toggle('ready', pD > 75);
}, {passive:true});
document.addEventListener('touchend', async () => {
  if(pY == null) return;
  const go = pD > 75; pY = null; pD = 0;
  ptr.style.opacity = ''; ptr.style.transform = ''; ptr.classList.remove('ready');
  if(go && !busy){ ptr.classList.add('busy'); try{ await refreshNow(true); } finally{ ptr.classList.remove('busy'); } }
});

/* ---------- start ---------- */
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(view.ch && view.data) paint(); }, 200); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshNow(); });
load(); route();
})();
</script>
